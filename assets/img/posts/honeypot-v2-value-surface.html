<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>body{margin:0;background:#0d0d0d}canvas{display:block}</style></head>
<body>
<div style="height:128px;padding:24px 60px 0 60px;background:#0d0d0d;box-sizing:border-box">
  <div style="color:#a9ff5b;font:700 20px 'DejaVu Sans'">WHAT THEY ASKED THE FAKE EXCHANGE FOR</div>
  <div style="color:#e5e5e5;font:700 30px 'DejaVu Sans';margin-top:6px">Value-surface requests, 4 addresses — 27 hits</div>
</div>
<canvas id="c" width="1200" height="432"></canvas><script>
Chart.defaults.font.family = 'DejaVu Sans';
Chart.defaults.color = '#8c8c8c';
Chart.register(ChartDataLabels);
const cfg = {type:'doughnut',data:{labels:["/api/v1/balance \u2014 10 (37%)", "/api/v1/withdraw \u2014 9 (33%)", "/api/v1/keys \u2014 5 (19%)", "/api/v1/export-seed (honeytoken) \u2014 3 (11%)"],datasets:[{data:[10, 9, 5, 3],backgroundColor:["#a9ff5b", "#ff7878", "#7dd3fc", "#ffc857"],borderColor:'#0d0d0d',borderWidth:3,hoverOffset:6}]}},options:{cutout:'56%',layout:{padding:12},plugins:{legend:{position:'top',align:'center',labels:{boxWidth:13,padding:10,font:{size:13},color:'#e5e5e5'}},datalabels:{color:'#0d0d0d',font:{size:15,weight:'bold'},formatter:function(v,ctx){const t=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);const p=v/t*100;return p>=6?p.toFixed(0)+'%':'';}}}}};
new Chart(document.getElementById('c'), cfg);
</script></body></html>
