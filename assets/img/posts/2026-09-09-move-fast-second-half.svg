<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect x="0" y="0" width="1200" height="8" fill="#a9ff5b"/>
  <rect y="622" width="1200" height="8" fill="#ff4d4d"/>
  <!-- visual: lightning bolt (speed) -->
  <polygon points="150,170 90,290 130,290 95,430 200,320 155,320 205,170" fill="#ffc857"/>
  <!-- visual: magnifier crossed out (understanding lost) -->
  <circle cx="1045" cy="300" r="72" fill="none" stroke="#a9ff5b" stroke-width="10"/>
  <line x1="1098" y1="353" x2="1150" y2="405" stroke="#a9ff5b" stroke-width="16" stroke-linecap="round"/>
  <line x1="1005" y1="262" x2="1085" y2="338" stroke="#ff4d4d" stroke-width="12" stroke-linecap="round"/>
  <line x1="1085" y1="262" x2="1005" y2="338" stroke="#ff4d4d" stroke-width="12" stroke-linecap="round"/>
  <!-- motion lines behind bolt -->
  <line x1="60" y1="210" x2="95" y2="210" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
  <line x1="45" y1="300" x2="92" y2="300" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="390" x2="98" y2="390" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
  <!-- kicker -->
  <text x="320" y="140" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#666666" letter-spacing="3">MOVE FAST AND BREAK THINGS</text>
  <line x1="318" y1="122" x2="920" y2="122" stroke="#ff4d4d" stroke-width="4"/>
  <!-- title -->
  <text x="320" y="270" font-family="DejaVu Sans" font-size="66" font-weight="bold" fill="#f5f5f5">WE KEPT THE SPEED.</text>
  <text x="320" y="350" font-family="DejaVu Sans" font-size="66" font-weight="bold" fill="#a9ff5b">WE LOST THE</text>
  <text x="320" y="430" font-family="DejaVu Sans" font-size="66" font-weight="bold" fill="#a9ff5b">UNDERSTANDING.</text>
  <!-- sub -->
  <text x="320" y="500" font-family="DejaVu Sans" font-size="26" fill="#b8b8b8">Facebook retired the slogan in 2014. Your AI team is reliving it now.</text>
  <!-- footer -->
  <text x="80" y="600" font-family="DejaVu Sans" font-size="22" fill="#666666">blog.oliveira.ninja</text>
</svg>
