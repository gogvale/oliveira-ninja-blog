<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .lbl { fill: #a9ff5b; font-size: 24px; font-weight: bold; }
      .t1  { fill: #ffffff; font-size: 56px; font-weight: bold; }
      .t2  { fill: #a9ff5b; font-size: 56px; font-weight: bold; }
      .sub { fill: #8c8c8c; font-size: 25px; }
      .m   { fill: #8c8c8c; font-size: 16px; }
      .mblue { fill: #7dd3fc; font-size: 21px; }
      .red { fill: #ff7878; font-size: 22px; font-weight: bold; }
      .foot { fill: #5a5a5a; font-size: 17px; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <g stroke="#161616" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="627"/><line x1="400" y1="0" x2="400" y2="627"/>
    <line x1="600" y1="0" x2="600" y2="627"/><line x1="800" y1="0" x2="800" y2="627"/>
    <line x1="1000" y1="0" x2="1000" y2="627"/>
  </g>
  <rect x="80" y="318" width="1040" height="222" rx="12" fill="#141414" stroke="#1f1f1f" stroke-width="1.5"/>

  <text x="80" y="86" class="lbl">THE ANNOUNCEMENT VERSUS THE MEASUREMENT</text>
  <text x="80" y="156" class="t1">WE REACHED AGI</text>
  <text x="80" y="216" class="t2">SEVEN TIMES THIS YEAR</text>
  <text x="80" y="258" class="sub">Announced: AGI. Independent score: 61 — tied with the model it replaced.</text>

  <!-- axis -->
  <line x1="140" y1="500" x2="1080" y2="500" stroke="#333333" stroke-width="2"/>
  <text x="140" y="524" class="m">JAN</text><text x="245" y="524" class="m">FEB</text>
  <text x="350" y="524" class="m">MAR</text><text x="455" y="524" class="m">APR</text>
  <text x="560" y="524" class="m">MAY</text><text x="665" y="524" class="m">JUN</text>
  <text x="770" y="524" class="m">JUL</text><text x="875" y="524" class="m">AUG</text>
  <text x="965" y="524" class="m">SEP</text>

  <!-- measured: flat dotted line at 61 -->
  <line x1="140" y1="462" x2="1080" y2="462" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="150" y="450" class="mblue">measured: 61 — tied with GPT-5.6 Sol</text>

  <!-- hype curve: gentle rise then vertical spike -->
  <polyline points="140,496 250,494 360,491 470,488 580,484 690,479 800,473 900,466 930,350"
            fill="none" stroke="#a9ff5b" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="930" y1="350" x2="930" y2="500" stroke="#ff7878" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle cx="930" cy="350" r="7" fill="#ff7878"/>
  <text x="945" y="344" class="red">7th arrival: AGI</text>
  <text x="140" y="486" class="m" fill="#5a5a5a">announced (axis bent to vertical)</text>

  <text x="80" y="600" class="foot">www.oliveira.ninja  ·  blog.oliveira.ninja  ·  github.com/gogvale</text>
</svg>
