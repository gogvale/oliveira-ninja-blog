<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      .title-red  { font-family: 'DejaVu Sans', sans-serif; font-weight: 700; font-size: 56px; fill: #ff7878; }
      .title-white{ font-family: 'DejaVu Sans', sans-serif; font-weight: 700; font-size: 56px; fill: #ebebeb; }
      .title-green{ font-family: 'DejaVu Sans', sans-serif; font-weight: 700; font-size: 56px; fill: #a9ff5b; }
      .subtitle   { font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; fill: #8c8c8c; }
      .pillar-lab { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; font-size: 18px; }
      .doc-text   { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; font-size: 18px; fill: #ffffff; }
      .note-text  { font-family: 'DejaVu Sans Mono', monospace; font-size: 16px; fill: #ffc857; }
      .note-sub   { font-family: 'DejaVu Sans Mono', monospace; font-size: 16px; fill: #8c8c8c; }
      .footer     { font-family: 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #505050; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="627" fill="#0d0d0d"/>

  <!-- subtle grid -->
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="627"/><line x1="40" y1="0" x2="40" y2="627"/>
    <line x1="80" y1="0" x2="80" y2="627"/><line x1="120" y1="0" x2="120" y2="627"/>
    <line x1="160" y1="0" x2="160" y2="627"/><line x1="200" y1="0" x2="200" y2="627"/>
    <line x1="240" y1="0" x2="240" y2="627"/><line x1="280" y1="0" x2="280" y2="627"/>
    <line x1="320" y1="0" x2="320" y2="627"/><line x1="360" y1="0" x2="360" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/><line x1="440" y1="0" x2="440" y2="627"/>
    <line x1="480" y1="0" x2="480" y2="627"/><line x1="520" y1="0" x2="520" y2="627"/>
    <line x1="560" y1="0" x2="560" y2="627"/><line x1="600" y1="0" x2="600" y2="627"/>
    <line x1="640" y1="0" x2="640" y2="627"/><line x1="680" y1="0" x2="680" y2="627"/>
    <line x1="720" y1="0" x2="720" y2="627"/><line x1="760" y1="0" x2="760" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/><line x1="840" y1="0" x2="840" y2="627"/>
    <line x1="880" y1="0" x2="880" y2="627"/><line x1="920" y1="0" x2="920" y2="627"/>
    <line x1="960" y1="0" x2="960" y2="627"/><line x1="1000" y1="0" x2="1000" y2="627"/>
    <line x1="1040" y1="0" x2="1040" y2="627"/><line x1="1080" y1="0" x2="1080" y2="627"/>
    <line x1="1120" y1="0" x2="1120" y2="627"/><line x1="1160" y1="0" x2="1160" y2="627"/>
    <line x1="1200" y1="0" x2="1200" y2="627"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- ============ TITLE BLOCK (top-left, y 30-170) ============ -->
  <text x="80" y="70" class="title-red">SDD IS DEAD.</text>
  <text x="80" y="135" class="title-white">LONG LIVE</text>
  <text x="80" y="200" class="title-green">VIBE CODING.</text>
  <text x="84" y="240" class="subtitle">the bridge is always temporary</text>

  <!-- ============ ANNOTATION (top-right, clear zone) ============ -->
  <text x="640" y="90" class="note-text">1,300 lines of spec</text>
  <text x="640" y="112" class="note-sub">for a date display</text>
  <!-- visible connector: solid line, full alpha, dashed style -->
  <line x1="700" y1="130" x2="700" y2="330" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 6" opacity="0.9"/>

  <!-- ============ ART ZONE (y 260-540) ============ -->

  <!-- left pillar: INTENTION -->
  <rect x="120" y="280" width="90" height="220" rx="8" fill="#14181c" stroke="#7dd3fc" stroke-width="3"/>
  <text x="145" y="395" class="pillar-lab" fill="#7dd3fc" text-anchor="middle">INTENTION</text>

  <!-- right pillar: MODEL -->
  <rect x="990" y="280" width="90" height="220" rx="8" fill="#14181c" stroke="#a9ff5b" stroke-width="3"/>
  <text x="1015" y="395" class="pillar-lab" fill="#a9ff5b" text-anchor="middle">MODEL</text>

  <!-- bridge docs: stack of 4, offset right, first two intact -->
  <g>
    <rect x="300" y="270" width="560" height="38" rx="6" fill="#121612" stroke="#a9ff5b" stroke-width="2"/>
    <text x="318" y="295" class="doc-text">requirements.md</text>

    <rect x="310" y="316" width="560" height="38" rx="6" fill="#121612" stroke="#a9ff5b" stroke-width="2"/>
    <text x="328" y="341" class="doc-text">design.md</text>

    <!-- the break: crack lines through doc 3 -->
    <rect x="320" y="362" width="560" height="38" rx="6" fill="#1a1414" stroke="#ff7878" stroke-width="2"/>
    <text x="338" y="387" class="doc-text">tasks.md</text>

    <rect x="330" y="408" width="560" height="38" rx="6" fill="#1a1414" stroke="#ff7878" stroke-width="2"/>
    <text x="348" y="433" class="doc-text">schema.md</text>
  </g>

  <!-- crack zigzag over the falling docs -->
  <polyline points="560,395 540,415 575,435 555,455 590,475" fill="none" stroke="#ff7878" stroke-width="3"/>

  <!-- fallen docs: rotated, below the bridge -->
  <g transform="rotate(10 400 500)">
    <rect x="360" y="490" width="520" height="34" rx="6" fill="#1a1414" stroke="#ff7878" stroke-width="2"/>
    <text x="376" y="512" class="doc-text" font-size="16px">tasks.md</text>
  </g>
  <g transform="rotate(-8 420 540)">
    <rect x="380" y="540" width="520" height="34" rx="6" fill="#1a1414" stroke="#ff7878" stroke-width="2"/>
    <text x="396" y="562" class="doc-text" font-size="16px">schema.md</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <text x="90" y="595" class="footer">www.oliveira.ninja  ·  blog.oliveira.ninja  ·  github.com/gogvale</text>
</svg>
