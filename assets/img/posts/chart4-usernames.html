<body>

<canvas id="c" width="1200" height="432"></canvas><script>
Chart.defaults.font.family = 'DejaVu Sans';

const cfg = {type:'doughnut',data:{labels:["root \u2014 12,066 (57%)", "ubuntu \u2014 1,655 (8%)", "admin \u2014 1,035 (5%)", "postgres \u2014 281 (1%)", "barsha \u2014 251 (1%)", "all other usernames \u2014 5,942 (28%)"],datasets:[{data:[12066, 1655, 1035, 281, 251, 5942],backgroundColor:["#ff7878", "#ffc857", "#7dd3fc", "#b388ff", "#a9ff5b", "#8c8c8c"],borderColor:'#0d0d0d',borderWidth:3,hoverOffset:6}]},options:{cutout:'56%',layout:{padding:{top:8,right:8,bottom:8,left:8}},plugins:{legend:{position:'top',align:'start',labels:{boxWidth:13,padding:8,font:{size:13},color:'#e5e5e5'}},datalabels:{color:'#0d0d0d',font:{size:13,weight:'bold'},formatter:function(v,ctx){const t=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);const p=v/t*100;return p>=5?p.toFixed(0)+'%':'';}}}}};
