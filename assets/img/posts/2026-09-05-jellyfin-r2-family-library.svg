<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <!-- grid -->
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="430" x2="1200" y2="430"/>
    <line x1="300" y1="0" x2="300" y2="627"/><line x1="600" y1="0" x2="600" y2="627"/><line x1="900" y1="0" x2="900" y2="627"/>
  </g>
  <!-- title block -->
  <text x="80" y="90" font-size="26" fill="#a9ff5b" font-weight="bold" letter-spacing="3">PROJECT · SELF-HOSTING</text>
  <text x="80" y="172" font-size="62" fill="#ffffff" font-weight="bold">The Family Netflix</text>
  <text x="80" y="248" font-size="62" fill="#7dd3fc" font-weight="bold">That Lives on R2</text>
  <text x="84" y="305" font-size="26" fill="#8c8c8c">Jellyfin on a droplet · library in the cloud · four households stream free</text>

  <!-- art band -->
  <!-- droplet/server -->
  <rect x="60" y="455" width="200" height="95" rx="12" fill="#181818" stroke="#a9ff5b" stroke-width="2"/>
  <text x="160" y="492" font-size="22" fill="#a9ff5b" font-weight="bold" text-anchor="middle">DROPLET</text>
  <text x="160" y="522" class="mono" font-size="15" fill="#8c8c8c" text-anchor="middle">Jellyfin</text>

  <!-- R2 cylinder -->
  <ellipse cx="460" cy="470" rx="70" ry="18" fill="#181818" stroke="#7dd3fc" stroke-width="2"/>
  <path d="M 390 470 L 390 525 A 70 18 0 0 0 530 525 L 530 470" fill="#0d0d0d" stroke="#7dd3fc" stroke-width="2"/>
  <ellipse cx="460" cy="470" rx="70" ry="18" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <text x="460" y="530" font-size="22" fill="#7dd3fc" font-weight="bold" text-anchor="middle">R2</text>
  <text x="460" y="556" class="mono" font-size="15" fill="#8c8c8c" text-anchor="middle">egress $0</text>

  <!-- arrow droplet -> R2 -->
  <path d="M 262 480 C 310 480, 330 480, 386 480" fill="none" stroke="#a9ff5b" stroke-width="4"/>
  <polygon points="390,480 378,472 378,488" fill="#a9ff5b"/>
  <text x="324" y="462" class="mono" font-size="15" fill="#a9ff5b" text-anchor="middle">rclone mount</text>

  <!-- households row -->
  <g>
    <rect x="650" y="435" width="110" height="80" rx="8" fill="#181818" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M 665 470 l 40 -28 l 40 28" fill="none" stroke="#8c8c8c" stroke-width="3"/>
    <rect x="682" y="472" width="46" height="34" fill="#0d0d0d" stroke="#8c8c8c" stroke-width="2"/>
    <rect x="694" y="482" width="22" height="24" fill="#0d0d0d"/>
    <text x="705" y="500" font-size="13" fill="#5a5a5a" text-anchor="middle">MX</text>

    <rect x="790" y="435" width="110" height="80" rx="8" fill="#181818" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M 805 470 l 40 -28 l 40 28" fill="none" stroke="#8c8c8c" stroke-width="3"/>
    <rect x="822" y="472" width="46" height="34" fill="#0d0d0d" stroke="#8c8c8c" stroke-width="2"/>
    <rect x="834" y="482" width="22" height="24" fill="#0d0d0d"/>
    <text x="845" y="500" font-size="13" fill="#5a5a5a" text-anchor="middle">MX</text>

    <rect x="930" y="435" width="110" height="80" rx="8" fill="#181818" stroke="#8c8c8c" stroke-width="2"/>
    <path d="M 945 470 l 40 -28 l 40 28" fill="none" stroke="#8c8c8c" stroke-width="3"/>
    <rect x="962" y="472" width="46" height="34" fill="#0d0d0d" stroke="#8c8c8c" stroke-width="2"/>
    <rect x="974" y="482" width="22" height="24" fill="#0d0d0d"/>
    <text x="985" y="500" font-size="13" fill="#5a5a5a" text-anchor="middle">MX</text>

    <rect x="1070" y="435" width="110" height="80" rx="8" fill="#181818" stroke="#ffc857" stroke-width="2"/>
    <path d="M 1085 470 l 40 -28 l 40 28" fill="none" stroke="#ffc857" stroke-width="3"/>
    <rect x="1102" y="472" width="46" height="34" fill="#0d0d0d" stroke="#ffc857" stroke-width="2"/>
    <rect x="1114" y="482" width="22" height="24" fill="#0d0d0d"/>
    <text x="1125" y="500" font-size="13" fill="#8a6d1f" text-anchor="middle">EU</text>
  </g>
  <!-- arrow R2 -> households -->
  <path d="M 534 500 C 580 540, 600 540, 646 505" fill="none" stroke="#ffc857" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="648,503 634,502 640,514" fill="#ffc857"/>

  <!-- footer -->
  <text x="1200" y="620" font-size="14" fill="#5a5a5a" text-anchor="end">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
