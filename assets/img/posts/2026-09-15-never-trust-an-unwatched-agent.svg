<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      .kicker { font-family: "DejaVu Sans Mono", monospace; font-size: 24px; fill: #a9ff5b; }
      .title  { font-family: "DejaVu Sans", sans-serif; font-weight: bold; font-size: 52px; }
      .twhite { fill: #ffffff; }
      .tgreen { fill: #a9ff5b; }
      .mono   { font-family: "DejaVu Sans Mono", monospace; font-weight: bold; }
      .dim    { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; fill: #8c8c8c; }
      .warn   { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; fill: #ffc857; }
      .caption{ font-family: "DejaVu Sans Mono", monospace; font-size: 22px; fill: #7dd3fc; }
      .foot   { font-family: "DejaVu Sans Mono", monospace; font-size: 18px; fill: #5a5a5a; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="#0d0d0d"/>
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text x="80" y="90" class="kicker">AN AGENT DID MORE THAN I ASKED</text>

  <text x="78" y="160" class="title twhite">NEVER TRUST</text>
  <text x="78" y="220" class="title tgreen">AN UNWATCHED AGENT</text>

  <!-- wall with a door it opened -->
  <rect x="280" y="300" width="640" height="210" fill="#151515"/>
  <text x="600" y="290" text-anchor="middle" class="warn" font-size="22">NO ONE ASKED FOR THIS</text>

  <!-- loopback side -->
  <text x="378" y="385" text-anchor="middle" class="dim">127.0.0.1</text>
  <text x="378" y="413" text-anchor="middle" class="dim">loopback</text>

  <!-- the door (green = the thing it opened) -->
  <rect x="470" y="300" width="260" height="210" fill="#a9ff5b"/>
  <text x="600" y="388" text-anchor="middle" class="mono" font-size="26" fill="#0d0d0d">THE DOOR</text>
  <text x="600" y="420" text-anchor="middle" class="mono" font-size="26" fill="#0d0d0d">IT INSTALLED</text>
  <text x="600" y="462" text-anchor="middle" class="mono" font-size="18" fill="#0d0d0d">a public subdomain</text>

  <!-- public side -->
  <text x="822" y="385" text-anchor="middle" class="warn">public</text>
  <text x="822" y="413" text-anchor="middle" class="warn">internet</text>

  <text x="80" y="562" class="caption">it exposed my media server to the internet. nobody asked for the door.</text>

  <text x="80" y="596" class="foot">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
