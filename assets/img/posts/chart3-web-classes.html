<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<body>

</div>
<canvas id="c" width="1200" height="432"></canvas><script>
Chart.defaults.font.family = 'DejaVu Sans';

Chart.register(ChartDataLabels);
const cfg = {type:'doughnut',data:{labels:["XML-RPC (automation endpoint) \u2014 32,826 (73%)", "storefront pages + assets \u2014 6,448 (14%)", "other / misc \u2014 3,559 (8%)", "wp-login (admin login) \u2014 1,482 (3%)", "wp-admin (dashboard) \u2014 391 (1%)", "REST API \u2014 255 (1%)", "author enumeration \u2014 62 (0%)"],datasets:[{data:[32826, 6448, 3559, 1482, 391, 255, 62],backgroundColor:["#ffc857", "#a9ff5b", "#8c8c8c", "#ff7878", "#7dd3fc", "#5a5a5a", "#b388ff"],borderColor:'#0d0d0d',borderWidth:3,hoverOffset:6}]},options:{cutout:'56%',layout:{padding:{top:8,right:8,bottom:8,left:8}},plugins:{legend:{position:'top',align:'start',labels:{boxWidth:13,padding:8,font:{size:13},color:'#e5e5e5'}},datalabels:{color:'#0d0d0d',font:{size:13,weight:'bold'},formatter:function(v,ctx){const t=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);const p=v/t*100;return p>=6?p.toFixed(0)+'%':'';}}}}};

</script></body></html>
