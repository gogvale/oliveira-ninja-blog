<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      .kicker { font-family: "DejaVu Sans Mono", monospace; font-size: 24px; fill: #a9ff5b; }
      .title  { font-family: "DejaVu Sans", sans-serif; font-weight: bold; font-size: 50px; }
      .twhite { fill: #ffffff; }
      .tgreen { fill: #a9ff5b; }
      .lbl    { font-family: "DejaVu Sans", sans-serif; font-weight: bold; }
      .sublbl { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; fill: #0d0d0d; }
      .caption{ font-family: "DejaVu Sans Mono", monospace; font-size: 20px; fill: #8c8c8c; }
      .foot   { font-family: "DejaVu Sans Mono", monospace; font-size: 18px; fill: #5a5a5a; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <!-- subtle grid -->
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- kicker -->
  <text x="80" y="90" class="kicker">EVERY TURN. EVERY QUESTION. FOREVER.</text>

  <!-- title -->
  <text x="78" y="160" class="title twhite">YOU ARE PAYING FOR PROMPTS</text>
  <text x="78" y="222" class="title tgreen">YOU NEVER WROTE</text>

  <!-- meter label -->
  <text x="80" y="300" class="caption">WHAT ONE TURN ACTUALLY BILLS</text>

  <!-- the bar: scaffolding (huge) vs your question (sliver) -->
  <!-- scaffolding block -->
  <rect x="80" y="322" width="820" height="100" fill="#a9ff5b"/>
  <text x="490" y="362" text-anchor="middle" class="lbl" font-size="34" fill="#0d0d0d">PROMPTS YOU NEVER WROTE</text>
  <text x="490" y="400" text-anchor="middle" class="sublbl">system prompt · tools · memory · skills</text>

  <!-- your question sliver -->
  <rect x="900" y="322" width="140" height="100" fill="#ffc857"/>
  <text x="970" y="366" text-anchor="middle" class="lbl" font-size="20" fill="#0d0d0d">YOUR</text>
  <text x="970" y="392" text-anchor="middle" class="lbl" font-size="20" fill="#0d0d0d">QUESTION</text>

  <!-- callout to the sliver -->
  <text x="970" y="470" text-anchor="middle" class="caption">the ~40 tokens you typed</text>

  <!-- money line -->
  <text x="80" y="530" class="lbl" font-size="24" fill="#7dd3fc">29,000 tokens of fixed overhead. The question barely registers.</text>

  <!-- footer -->
  <text x="80" y="595" class="foot">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
