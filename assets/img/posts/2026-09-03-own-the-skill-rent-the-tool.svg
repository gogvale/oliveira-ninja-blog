<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <!-- subtle grid -->
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="300" y1="0" x2="300" y2="627"/>
    <line x1="600" y1="0" x2="600" y2="627"/><line x1="900" y1="0" x2="900" y2="627"/>
  </g>
  <!-- label -->
  <text x="80" y="84" font-size="24" fill="#a9ff5b" letter-spacing="3">2026 · AI-DEPENDENCE · VIBE CODING</text>
  <!-- title -->
  <text x="80" y="168" font-size="62" font-weight="bold" fill="#ffffff">OWN THE SKILL.</text>
  <text x="80" y="248" font-size="62" font-weight="bold" fill="#a9ff5b">RENT THE TOOL.</text>
  <text x="80" y="298" font-size="27" fill="#8c8c8c">FiletOfFish1066 rented his job out. The market still pays for the skill.</text>

  <!-- two panels -->
  <rect x="80" y="330" width="490" height="196" rx="10" fill="#111111" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="104" y="366" font-size="26" font-weight="bold" fill="#a9ff5b">YOURS</text>
  <text x="104" y="404" font-size="23" fill="#e8e8e8">skills · scripts · verified fixes</text>
  <text x="104" y="438" font-size="23" fill="#e8e8e8">restores · code you can read</text>
  <text x="104" y="472" font-size="23" fill="#a9ff5b">runs when the lease dies</text>
  <text x="104" y="506" font-size="23" fill="#8c8c8c">price: 0 — forever</text>

  <rect x="630" y="330" width="490" height="196" rx="10" fill="#111111" stroke="#3a2020" stroke-width="1.5"/>
  <text x="654" y="366" font-size="26" font-weight="bold" fill="#ff7878">RENTED</text>
  <text x="654" y="404" font-size="23" fill="#e8e8e8">tokens · copilot · the lease</text>
  <text x="654" y="438" font-size="23" fill="#e8e8e8">prompt drift · API terms</text>
  <text x="654" y="472" font-size="23" fill="#ff7878">leaseholder sets the terms</text>
  <text x="654" y="506" font-size="23" fill="#8c8c8c">price: meter running</text>

  <!-- footer -->
  <text x="600" y="601" text-anchor="middle" font-size="19" fill="#5a5a5a">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
