<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!--
    COMPOSITION DOCUMENT, NOT THE RENDER SOURCE.
    The PNG of record is produced by ~/.hermes/scripts/banner_render_first_task.py
    (Pillow, 4x supersample). This SVG describes the same layout so it can be edited
    by hand; if the two disagree, the PNG is what shipped.

    Post: "Claude Picks My First Task of the Day" (2026-09-27)
    Data shown: 17 rows over 4 monday workspaces, 5 duplicates, 12 real items.
  -->
  <defs>
    <style>
      .kicker { font: 22px "DejaVu Sans Mono", monospace; fill: #a9ff5b; }
      .title  { font: bold 46px "DejaVu Sans", sans-serif; }
      .cap    { font: 17px "DejaVu Sans Mono", monospace; fill: #7dd3fc; }
      .head   { font: bold 15px "DejaVu Sans Mono", monospace; fill: #a9ff5b; }
      .headg  { font: bold 15px "DejaVu Sans Mono", monospace; fill: #8c8c8c; }
      .small  { font: 14px "DejaVu Sans Mono", monospace; fill: #6e6e6e; }
      .row    { font: 15px "DejaVu Sans Mono", monospace; fill: #8c8c8c; }
      .strip  { font: bold 19px "DejaVu Sans Mono", monospace; }
      .foot   { font: 18px "DejaVu Sans Mono", monospace; fill: #5a5a5a; }
    </style>
  </defs>

  <!-- field + grid -->
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- title block -->
  <text class="kicker" x="60" y="96">MONDAY · 4 WORKSPACES · 17 ROWS · 5 DUPLICATES</text>
  <text class="title" x="58" y="158" fill="#ffffff">CLAUDE PICKS MY</text>
  <text class="title" x="58" y="206" fill="#a9ff5b">FIRST TASK OF THE DAY</text>
  <text class="cap" x="60" y="240">reads monday live, asks before it writes, hands me the queue</text>

  <!-- left panel: the board, 4 columns (P1..P4 = 5/4/4/4 rows), duplicates outlined green -->
  <rect x="56" y="254" width="500" height="258" fill="#131313" stroke="#2c2c2c" stroke-width="2"/>
  <text class="headg" x="72" y="278">THE BOARD I WAS READING</text>
  <g class="row">
    <text x="72" y="300">P1 · 5</text><text x="192" y="300">P2 · 4</text>
    <text x="312" y="300">P3 · 4</text><text x="432" y="300">P4 · 4</text>
  </g>
  <!-- rows: grey = ordinary row, green = one of the five duplicate rows -->
  <g>
    <rect x="72" y="306" width="112" height="18" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
    <rect x="72" y="330" width="112" height="18" fill="#2e2e2e"/>
    <rect x="72" y="354" width="112" height="18" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
    <rect x="72" y="378" width="112" height="18" fill="#2e2e2e"/>
    <rect x="72" y="402" width="112" height="18" fill="#2e2e2e"/>

    <rect x="192" y="306" width="112" height="18" fill="#2e2e2e"/>
    <rect x="192" y="330" width="112" height="18" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
    <rect x="192" y="354" width="112" height="18" fill="#2e2e2e"/>
    <rect x="192" y="378" width="112" height="18" fill="#2e2e2e"/>

    <rect x="312" y="306" width="112" height="18" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
    <rect x="312" y="330" width="112" height="18" fill="#2e2e2e"/>
    <rect x="312" y="354" width="112" height="18" fill="#2e2e2e"/>
    <rect x="312" y="378" width="112" height="18" fill="#2e2e2e"/>

    <rect x="432" y="306" width="112" height="18" fill="#2e2e2e"/>
    <rect x="432" y="330" width="112" height="18" fill="#2e2e2e"/>
    <rect x="432" y="354" width="112" height="18" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
    <rect x="432" y="378" width="112" height="18" fill="#2e2e2e"/>
  </g>
  <!-- wiring: each duplicate row drops to the bus, the bus feeds the merged card -->
  <g stroke="#a9ff5b" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="128" y1="324" x2="128" y2="452"/><line x1="128" y1="372" x2="128" y2="452"/>
    <line x1="248" y1="348" x2="248" y2="452"/><line x1="368" y1="324" x2="368" y2="452"/>
    <line x1="488" y1="372" x2="488" y2="452"/>
  </g>
  <line x1="72" y1="452" x2="540" y2="452" stroke="#3c542c" stroke-width="2"/>
  <rect x="150" y="464" width="312" height="34" fill="#162214" stroke="#a9ff5b" stroke-width="2"/>
  <text class="head" x="306" y="486" text-anchor="middle">5 ROWS — ONE JOB</text>

  <!-- middle: what stands between the board and the queue -->
  <line x1="576" y1="384" x2="676" y2="384" stroke="#a9ff5b" stroke-width="3"/>
  <polygon points="676,384 664,378 664,390" fill="#a9ff5b"/>
  <text class="head" x="626" y="362" text-anchor="middle">CLAUDE</text>
  <text class="small" x="626" y="404" text-anchor="middle">reads live</text>
  <text class="small" x="626" y="420" text-anchor="middle">asks first</text>

  <!-- right panel: today's queue, triage order, first line marked -->
  <rect x="696" y="254" width="448" height="258" fill="#131313" stroke="#2c2c2c" stroke-width="2"/>
  <text class="head" x="712" y="278">TODAY'S QUEUE</text>
  <rect x="712" y="296" width="416" height="32" fill="#1a2616" stroke="#a9ff5b" stroke-width="2"/>
  <text class="row" x="726" y="318" fill="#a9ff5b">1</text>
  <text class="row" x="756" y="318" fill="#ffffff">blocked or at risk</text>
  <text class="small" x="1116" y="318" text-anchor="end" fill="#a9ff5b">START HERE</text>

  <rect x="712" y="336" width="416" height="32" fill="#181818"/>
  <text class="row" x="726" y="358">2</text><text class="row" x="756" y="358">overdue, due within a week</text>
  <rect x="712" y="376" width="416" height="32" fill="#181818"/>
  <text class="row" x="726" y="398">3</text><text class="row" x="756" y="398">no status yet</text>
  <rect x="712" y="416" width="416" height="32" fill="#181818"/>
  <text class="row" x="726" y="438">4</text><text class="row" x="756" y="438">in progress</text>
  <rect x="712" y="456" width="416" height="32" fill="#181818"/>
  <text class="row" x="726" y="478">5</text><text class="row" x="756" y="478">the rest</text>

  <!-- bottom strip: the only numbers that matter -->
  <line x1="56" y1="540" x2="1144" y2="540" stroke="#2c2c2c" stroke-width="2"/>
  <text class="strip" x="58" y="571" fill="#a9ff5b">IN   17 ROWS · 4 WORKSPACES · 5 DUPLICATES</text>
  <text class="strip" x="1144" y="571" text-anchor="end" fill="#ffffff">OUT   12 ITEMS · 1 QUEUE</text>
  <text class="foot" x="58" y="614">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
