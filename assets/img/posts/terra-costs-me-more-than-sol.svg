<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- Composition twin for assets/img/posts/terra-costs-me-more-than-sol.png.
       The PNG of record is rendered by ~/.hermes/scripts/banner_render_terra.py
       (Pillow, 4x supersample); this SVG documents the composition and is the
       file to edit when the layout changes. Prices: OpenAI API price sheet as
       mirrored by benchlm.ai, October 2026 — Sol $2/$10, Terra $1/$5,
       Luna $0.10/$0.50 per 1M in/out tokens. -->
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .grid { stroke: #181818; stroke-width: 1; }
      .panel { fill: #131313; stroke: #2c2c2c; stroke-width: 2; }
      .barhead { fill: #1a1a1a; }
      .kicker { font: 21px 'DejaVu Sans Mono', monospace; fill: #a9ff5b; letter-spacing: 1px; }
      .title { font: bold 46px 'DejaVu Sans', sans-serif; fill: #ffffff; }
      .title-accent { font: bold 46px 'DejaVu Sans', sans-serif; fill: #a9ff5b; }
      .cap { font: 17px 'DejaVu Sans Mono', monospace; fill: #7dd3fc; }
      .head { font: bold 14px 'DejaVu Sans Mono', monospace; fill: #a9ff5b; }
      .head-warn { font: bold 14px 'DejaVu Sans Mono', monospace; fill: #ff6e6e; }
      .row { font: 15px 'DejaVu Sans Mono', monospace; fill: #969696; }
      .row-on { font: 15px 'DejaVu Sans Mono', monospace; fill: #ffffff; }
      .price { font: bold 16px 'DejaVu Sans Mono', monospace; fill: #969696; }
      .price-on { font: bold 16px 'DejaVu Sans Mono', monospace; fill: #a9ff5b; }
      .small { font: 12px 'DejaVu Sans Mono', monospace; fill: #6e6e6e; }
      .strip { font: bold 19px 'DejaVu Sans Mono', monospace; }
      .foot { font: 18px 'DejaVu Sans Mono', monospace; fill: #5a5a5a; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="627"/>
  <g class="grid">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text class="kicker" x="60" y="86">CODEX 6.x · THREE TIERS · ONE NANNY</text>
  <text class="title" x="58" y="146">TERRA COSTS ME</text>
  <text class="title-accent" x="58" y="194">MORE THAN SOL</text>
  <text class="cap" x="60" y="225">the invoice dropped by half — my afternoon did not</text>

  <!-- left: the price ladder -->
  <rect class="panel" x="56" y="244" width="544" height="264"/>
  <rect class="barhead" x="56" y="244" width="544" height="26"/>
  <text class="head" x="70" y="262">PRICE PER 1M OUTPUT TOKENS</text>
  <text class="small" x="586" y="262" text-anchor="end">USD</text>

  <text class="row" x="72" y="301">SOL</text>
  <rect x="156" y="292" width="300" height="22" fill="#181818"/>
  <rect x="156" y="292" width="300" height="22" fill="#4a4a4a"/>
  <text class="price" x="468" y="309">$10.00</text>

  <text class="row-on" x="72" y="363">TERRA</text>
  <rect x="156" y="354" width="300" height="22" fill="#181818"/>
  <rect x="156" y="354" width="150" height="22" fill="#a9ff5b"/>
  <text class="price-on" x="468" y="371">$5.00</text>

  <text class="row" x="72" y="425">LUNA</text>
  <rect x="156" y="416" width="300" height="22" fill="#181818"/>
  <rect x="156" y="416" width="15" height="22" fill="#4a4a4a"/>
  <text class="price" x="468" y="433">$0.50</text>

  <text class="small" x="72" y="476">Terra is half of Sol. Luna is a twentieth.</text>
  <text class="small" x="72" y="492">On paper the easiest decision in the world.</text>

  <!-- right: what the cheap tier actually costs -->
  <rect class="panel" x="640" y="244" width="504" height="264"/>
  <rect class="barhead" x="640" y="244" width="504" height="26"/>
  <text class="head-warn" x="654" y="262">WHAT I ACTUALLY PAY</text>

  <g fill="#181818" stroke="#2c2c2c" stroke-width="2">
    <rect x="662" y="288" width="432" height="38"/>
    <rect x="662" y="340" width="432" height="38"/>
    <rect x="662" y="392" width="432" height="38"/>
  </g>
  <rect x="662" y="444" width="432" height="38" fill="#241818" stroke="#ff6e6e" stroke-width="2"/>
  <text class="row" x="674" y="312">ask for four call sites</text>
  <text class="row" x="674" y="364">confirm it ran</text>
  <text class="row" x="674" y="416">correct the missing two</text>
  <text class="row-on" x="674" y="468">correct the correction</text>

  <g stroke="#6e6e6e" stroke-width="2" fill="none">
    <path d="M688 328 L688 338" marker-end="url(#a)"/>
    <path d="M688 380 L688 390" marker-end="url(#a)"/>
    <path d="M688 432 L688 442" marker-end="url(#a)"/>
  </g>
  <g stroke="#ff6e6e" stroke-width="2" fill="none">
    <path d="M1110 482 L1110 300" marker-end="url(#r)"/>
    <path d="M1092 482 L1110 482"/>
  </g>
  <text class="small" x="1100" y="492" text-anchor="end" fill="#ff6e6e">MY TIME</text>

  <!-- strip + footer -->
  <line x1="56" y1="536" x2="1144" y2="536" stroke="#2c2c2c" stroke-width="2"/>
  <text class="strip" x="58" y="563" fill="#a9ff5b">IN   $5 / 1M OUTPUT TOKENS</text>
  <text class="strip" x="1144" y="563" text-anchor="end" fill="#ff6e6e">OUT   HOURS OF ME, CHECKING</text>
  <text class="foot" x="58" y="604">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
