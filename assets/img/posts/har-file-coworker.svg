<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!--
    Composition source for assets/img/posts/har-file-coworker.png.
    The PNG of record is drawn by ~/.hermes/scripts/banner_render_har.py (Pillow);
    this SVG documents the same layout so it can be edited. No numbers here come
    from a measurement: the request rows are an illustration of a Network tab, and
    every figure in the strip and caption is one the post states.
  -->
  <rect width="1200" height="627" fill="#0d0d0d"/>
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text x="60" y="90" font-family="DejaVu Sans Mono" font-size="21" fill="#a9ff5b">PHP2SHELL WEEK · NO EXPORT BUTTON · ONE TAB</text>
  <text x="58" y="150" font-family="DejaVu Sans" font-weight="bold" font-size="46" fill="#ffffff">I TURNED A HAR FILE</text>
  <text x="58" y="198" font-family="DejaVu Sans" font-weight="bold" font-size="46" fill="#a9ff5b">INTO A COWORKER</text>
  <text x="60" y="228" font-family="DejaVu Sans Mono" font-size="17" fill="#7dd3fc">the browser already logged every request — I just had to keep the file</text>

  <!-- left: Network panel -->
  <rect x="56" y="246" width="392" height="266" fill="#131313" stroke="#2c2c2c" stroke-width="2"/>
  <rect x="56" y="246" width="392" height="26" fill="#1a1a1a"/>
  <circle cx="73" cy="259" r="4" fill="#464646"/><circle cx="87" cy="259" r="4" fill="#464646"/><circle cx="101" cy="259" r="4" fill="#464646"/>
  <text x="120" y="265" font-family="DejaVu Sans Mono" font-weight="bold" font-size="14" fill="#969696">Network</text>
  <text x="64" y="292" font-family="DejaVu Sans Mono" font-size="12" fill="#6e6e6e">214 REQUESTS</text>
  <text x="64" y="496" font-family="DejaVu Sans Mono" font-size="12" fill="#a9ff5b">?q=ana — the address came back in the response</text>

  <!-- middle: saved file -->
  <text x="498" y="275" font-family="DejaVu Sans Mono" font-size="12" fill="#a9ff5b" text-anchor="middle">SAVE ALL AS HAR</text>
  <line x1="452" y1="330" x2="496" y2="330" stroke="#a9ff5b" stroke-width="3"/>
  <polygon points="496,330 487,325 487,335" fill="#a9ff5b"/>
  <rect x="500" y="292" width="192" height="138" fill="#141a12" stroke="#a9ff5b" stroke-width="2"/>
  <path d="M672 292 l20 20 h-20 z" fill="none" stroke="#a9ff5b" stroke-width="2"/>
  <text x="514" y="320" font-family="DejaVu Sans Mono" font-weight="bold" font-size="16" fill="#ffffff">session.har</text>
  <text x="514" y="344" font-family="DejaVu Sans Mono" font-size="12" fill="#7dd3fc">{</text>
  <text x="514" y="360" font-family="DejaVu Sans Mono" font-size="12" fill="#7dd3fc">  "log": {</text>
  <text x="514" y="376" font-family="DejaVu Sans Mono" font-size="12" fill="#7dd3fc">    "entries": [ … ]</text>
  <text x="514" y="392" font-family="DejaVu Sans Mono" font-size="12" fill="#7dd3fc">  }</text>
  <text x="514" y="408" font-family="DejaVu Sans Mono" font-size="12" fill="#6e6e6e">readable by a script</text>

  <text x="716" y="275" font-family="DejaVu Sans Mono" font-size="12" fill="#a9ff5b" text-anchor="middle">CLAUDE</text>
  <line x1="696" y1="330" x2="740" y2="330" stroke="#a9ff5b" stroke-width="3"/>
  <polygon points="740,330 731,325 731,335" fill="#a9ff5b"/>

  <!-- right: the table -->
  <rect x="744" y="246" width="400" height="266" fill="#131313" stroke="#2c2c2c" stroke-width="2"/>
  <rect x="744" y="246" width="400" height="26" fill="#1a1a1a"/>
  <text x="760" y="265" font-family="DejaVu Sans Mono" font-weight="bold" font-size="14" fill="#a9ff5b">NAME → ADDRESS</text>
  <text x="772" y="478" font-family="DejaVu Sans Mono" font-size="12" fill="#6e6e6e">the cookie dies in an hour — so does the file</text>

  <!-- strip -->
  <line x1="56" y1="540" x2="1144" y2="540" stroke="#2c2c2c" stroke-width="2"/>
  <text x="58" y="570" font-family="DejaVu Sans Mono" font-weight="bold" font-size="19" fill="#a9ff5b">IN   1 HAR FILE · NO EXPORT · NO API KEY</text>
  <text x="1144" y="570" font-family="DejaVu Sans Mono" font-weight="bold" font-size="19" fill="#ffffff" text-anchor="end">OUT   5 MINUTES · NAME → EMAIL</text>
  <text x="58" y="608" font-family="DejaVu Sans Mono" font-size="18" fill="#5a5a5a">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
