<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      .kicker { font-family: "DejaVu Sans Mono", monospace; font-size: 24px; fill: #a9ff5b; }
      .title  { font-family: "DejaVu Sans", sans-serif; font-weight: bold; font-size: 52px; }
      .twhite { fill: #ffffff; }
      .tgreen { fill: #a9ff5b; }
      .barlab { font-family: "DejaVu Sans Mono", monospace; font-size: 22px; fill: #e0e0e0; }
      .barpct { font-family: "DejaVu Sans Mono", monospace; font-weight: bold; font-size: 22px; fill: #0d0d0d; }
      .caption{ font-family: "DejaVu Sans Mono", monospace; font-size: 22px; fill: #7dd3fc; }
      .foot   { font-family: "DejaVu Sans Mono", monospace; font-size: 18px; fill: #5a5a5a; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="#0d0d0d"/>
  <g stroke="#181818" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text x="80" y="90" class="kicker">HALF OF US USE IT. ONE IN FIVE USE IT WELL.</text>

  <text x="78" y="160" class="title twhite">YOU'RE THE ONLY ONE</text>
  <text x="78" y="220" class="title tgreen">USING AI</text>

  <!-- where AI users sit -->
  <rect x="80" y="300" width="236" height="34" fill="#a9ff5b"/>
  <text x="326" y="325" class="barpct">19%</text>
  <text x="390" y="325" class="barlab">The Frontier</text>

  <rect x="80" y="360" width="620" height="34" fill="#4fb3a5"/>
  <text x="710" y="385" class="barpct">50%</text>
  <text x="774" y="385" class="barlab">The Power Users</text>

  <rect x="80" y="420" width="198" height="34" fill="#8c8c8c"/>
  <text x="288" y="445" class="barpct">16%</text>
  <text x="352" y="445" class="barlab">Stalled</text>

  <text x="80" y="538" class="caption">the panic runs at 3.4x the facts</text>

  <text x="80" y="596" class="foot">www.oliveira.ninja · blog.oliveira.ninja · github.com/gogvale</text>
</svg>
